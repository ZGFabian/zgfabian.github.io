<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

<script>
document.addEventListener('DOMContentLoaded', function () {
  const items = Array.from(document.querySelectorAll('.gallery-item-link'));
  if (!items.length) return;

  // Create lightbox DOM
  const lb = document.createElement('div');
  lb.id = 'custom-lightbox';
  lb.innerHTML = `
    <button id="lb-prev" aria-label="Previous">‹</button>
    <div id="lb-inner"><img id="lb-image" src="" alt=""><p id="lb-caption"></p></div>
    <button id="lb-next" aria-label="Next">›</button>
    <button id="lb-close" aria-label="Close">×</button>
  `;
  document.body.appendChild(lb);

  // Basic styles (move to CSS file later)
  const s = document.createElement('style');
  s.textContent = `
    #custom-lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);z-index:9999}
    #lb-inner{max-width:90vw;max-height:90vh;text-align:center}
    #lb-image{max-width:100%;max-height:80vh;display:block;margin:0 auto}
    #lb-caption{color:#fff;margin-top:8px}
    #lb-prev,#lb-next,#lb-close{position:fixed;background:transparent;color:#fff;border:0;font-size:32px;padding:12px;cursor:pointer}
    #lb-prev{left:12px;top:50%;transform:translateY(-50%)}
    #lb-next{right:12px;top:50%;transform:translateY(-50%)}
    #lb-close{right:12px;top:12px;font-size:28px}
  `;
  document.head.appendChild(s);

  const lbImage = lb.querySelector('#lb-image');
  const lbCaption = lb.querySelector('#lb-caption');
  const btnNext = lb.querySelector('#lb-next');
  const btnPrev = lb.querySelector('#lb-prev');
  const btnClose = lb.querySelector('#lb-close');

  let current = 0;

  function show(index) {
    current = (index + items.length) % items.length;
    const a = items[current];
    lbImage.src = a.getAttribute('href');
    lbImage.alt = a.getAttribute('data-title') || a.querySelector('img')?.alt || '';
    lbCaption.textContent = a.getAttribute('data-title') || '';
    lb.style.display = 'flex';
    document.documentElement.style.overflow = 'hidden';
  }
  function hide() {
    lb.style.display = 'none';
    lbImage.src = '';
    document.documentElement.style.overflow = '';
  }

  items.forEach((a, i) => {
    a.addEventListener('click', e => {
      e.preventDefault();
      show(i);
    });
  });

  btnNext.addEventListener('click', () => show(current + 1));
  btnPrev.addEventListener('click', () => show(current - 1));
  btnClose.addEventListener('click', hide);

  lb.addEventListener('click', e => { if (e.target === lb) hide(); });

  document.addEventListener('keydown', e => {
    if (lb.style.display === 'none') return;
    if (e.key === 'ArrowRight') show(current + 1);
    if (e.key === 'ArrowLeft') show(current - 1);
    if (e.key === 'Escape') hide();
  });

  // swipe support
  let startX = 0;
  lb.addEventListener('touchstart', e => startX = e.changedTouches[0].clientX, {passive:true});
  lb.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40) dx < 0 ? show(current + 1) : show(current - 1);
  }, {passive:true});
});
</script>

  </body>

</html>
