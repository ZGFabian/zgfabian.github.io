<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <!-- search -->
  <script src="https://unpkg.com/lunr/lunr.js"></script>
  <!-- mathjax.js -->
  {%- if page.MathJax -%}
  <script src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js" defer></script>
  {%- endif -%}
    <!-- Image Slider in HTML CSS Without JavaScript -->
  {%- if page.slider -%}
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
  {%- endif -%}

<!-- In your _includes/head.html or _layouts/default.html -->
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/lightbox.css">
<script src="{{ site.baseurl }}/assets/js/lightbox.js"></script>
<link rel="stylesheet" href="{{ '/assets/css/gallery.css' | relative_url }}">


<!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Bellefair">
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Raleway">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/override.css" />
</head>
