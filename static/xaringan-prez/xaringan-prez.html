.float-right[The Xaringan R package is an extension of the **R Markdown** markup language. It allows you to create HTML5 presentations. **HTML5** presentations showed in web browsers, but they can also be exported to PDF format and viewed in a PDF reader. Work both online and offline. &lt;img src="../../assets/img/etc/xaringan-logo.png" alt="xaringan-logo" style="float:left-column;height:100px;"&gt;Behind the scenes, Xaringan is powered by the **remark.js** JavaScript extension, which can be used on its own if you have sufficient knowledge of the JavaScript programming language. Xaringan “merely” makes things easier for those who are familiar with the R Markdown syntax and have some knowledge of web programming (CSS, HTML, JS).]

---

class: middle, inverse

&gt;*The name “xaringan” came from [Sharingan](http://naruto.wikia.com/wiki/Sharingan) in the Japanese manga and anime “Naruto.” The word was deliberately chosen to be difficult to pronounce for most people (unless you have watched the anime), because its author (me) loved the style very much, and was concerned that it would become too popular. The concern was somewhat naive, because the style is actually very customizable, and users started to contribute more themes to the package later.* - [Yihui Xie](https://bookdown.org/yihui/rmarkdown/xaringan.html), the principal author of Xaringan (and many more) R package
&lt;br&gt;&lt;br&gt;&lt;br&gt;

&gt;*"The Sharingan is an ability that allows a ninja to copy, by mere sight, their opponents' techniques while gaining incredible reflexes and perceptive abilities."* - [Urban Dictionary](https://www.urbandictionary.com/define.php?term=The%20Sharingan)

## Some useful features of Xaringan

- Based on Rmarkdown and require some html, css and optimally js knowledge
--
- online and offline presentations
--
- pdf output with other packages (e.g. `pagedown`) or with system tools ([See details here.](https://github.com/yihui/xaringan/wiki/Export-Slides-to-PDF))
--
- incremental rendering, revealing

# Advanced features

- Highlight styles for code blocks via [highlight.js](https://github.com/gnab/remark/wiki/Configuration#highlighting). (cf. in YAML `highlightStyle`)
- to create custom xaringan themes [`xaringanthemer`](https://cran.r-project.org/web/packages/xaringanthemer/vignettes/xaringanthemer.html) package is at your hand
- and [`xaringanExtra`](https://pkg.garrickadenbuie.com/xaringanExtra/) package is for advanced effects and layouts
- for more output formats, use [`xaringanBuilder`](https://github.com/jhelvy/xaringanBuilder). It can produce even gifs that everybody love (Not really.)

(function() {

(function(d) {
  let res = {};

    tr.querySelectorAll('td:first-child .key').forEach(key => {

// adds .remark-code-has-line-highlighted class to <pre> parent elements
// of code chunks containing highlighted lines with class .remark-code-line-highlighted
(function(d) {
  const hlines = d.querySelectorAll('.remark-code-line-highlighted');
  const preParents = [];
  const findPreParent = function(line, p = 0) {
    if (p > 1) return null; // traverse up no further than grandparent
    const el = line.parentElement;
    return el.tagName === "PRE" ? el : findPreParent(el, ++p);
  };

  for (let line of hlines) {
    let pre = findPreParent(line);
    if (pre && !preParents.includes(pre)) preParents.push(pre);
  }
  preParents.forEach(p => p.classList.add("remark-code-has-line-highlighted"));
})(document);</script>

<script>
slideshow._releaseMath = function(el) {
  var i, text, code, codes = el.getElementsByTagName('code');
  for (i = 0; i < codes.length;) {
    code = codes[i];
    if (code.parentNode.tagName !== 'PRE' && code.childElementCount === 0) {
      text = code.textContent;
      if (/^\\\((.|\s)+\\\)$/.test(text) || /^\\\[(.|\s)+\\\]$/.test(text) ||
          /^\$\$(.|\s)+\$\$$/.test(text) ||
          /^\\begin\{([^}]+)\}(.|\s)+\\end\{[^}]+\}$/.test(text)) {
        code.outerHTML = code.innerHTML;  // remove <code></code>
        continue;
      }
    }
    i++;
  }
};
slideshow._releaseMath(document);
</script>
